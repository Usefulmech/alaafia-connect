        <style>
            * {
                -webkit-tap-highlight-color: transparent;
            }
            body {
                font-family: "Plus Jakarta Sans","Noto Sans","Inter",sans-serif;
                background: #f9f9ff;
                overscroll-behavior-y: none;
            }

            /* Typing bounce */
            .typing-dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: #a3faef;
                animation: tdot 1.4s infinite ease-in-out both;
            }
            .typing-dot:nth-child(1) {
                animation-delay: 0s;
            }
            .typing-dot:nth-child(2) {
                animation-delay: 0.18s;
            }
            .typing-dot:nth-child(3) {
                animation-delay: 0.36s;
            }
            @keyframes tdot {
                0%,
                80%,
                100% {
                    transform: translateY(0);
                    opacity: 0.6;
                }
                40% {
                    transform: translateY(-7px);
                    opacity: 1;
                }
            }

            /* Waveform bars */
            .wave-bar {
                border-radius: 3px;
                animation: wavebar 1.1s infinite ease-in-out alternate;
            }
            .wave-bar:nth-child(1) {
                height: 6px;
                animation-delay: 0s;
            }
            .wave-bar:nth-child(2) {
                height: 14px;
                animation-delay: 0.1s;
            }
            .wave-bar:nth-child(3) {
                height: 20px;
                animation-delay: 0.2s;
            }
            .wave-bar:nth-child(4) {
                height: 12px;
                animation-delay: 0.3s;
            }
            .wave-bar:nth-child(5) {
                height: 18px;
                animation-delay: 0.4s;
            }
            .wave-bar:nth-child(6) {
                height: 10px;
                animation-delay: 0.5s;
            }
            .wave-bar:nth-child(7) {
                height: 16px;
                animation-delay: 0.6s;
            }
            .wave-bar:nth-child(8) {
                height: 8px;
                animation-delay: 0.7s;
            }
            @keyframes wavebar {
                from {
                    transform: scaleY(1);
                }
                to {
                    transform: scaleY(0.4);
                }
            }

            /* Scrollbar */
            .chat-area::-webkit-scrollbar {
                width: 3px;
            }
            .chat-area::-webkit-scrollbar-thumb {
                background: #bdc9c6;
                border-radius: 4px;
            }

            /* Recording pulse */
            @keyframes recPulse {
                0%,
                100% {
                    box-shadow: 0 0 0 0 rgba(186, 26, 26, 0.35);
                }
                50% {
                    box-shadow: 0 0 0 8px rgba(186, 26, 26, 0);
                }
            }
            .rec-pulse {
                animation: recPulse 1s infinite;
            }

            /* Triage card slide-up */
            @keyframes slideUp {
                from {
                    opacity: 0;
                    transform: translateY(16px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .slide-up {
                animation: slideUp 0.35s ease-out;
            }

            /* AI message pop */
            @keyframes msgPop {
                from {
                    opacity: 0;
                    transform: scale(0.96);
                }
                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }
            .msg-pop {
                animation: msgPop 0.25s ease-out;
            }

            /* Language btn active */
            .lang-active {
                background: #005c55 !important;
                color: #ffffff !important;
            }
        </style>

            // ── State ──────────────────────────────────────────────────────────────────
            const SYSTEM_PROMPT = `You are Àlàáfíà AI, a compassionate Nigerian healthcare AI assistant built on the Àlàáfíà Connect platform. Your role is to conduct a warm, friendly symptom intake assessment.

Rules:
- Ask about symptoms ONE AT A TIME. Be conversational, not clinical.
- Occasionally use Yoruba or Hausa phrases naturally (e.g., "Ẹ káàbọ̀", "Barka da zuwa", "Báwo ni?").
- After 3–4 exchanges gathering symptoms, produce a triage assessment embedded in this EXACT format at the END of your response:
  [TRIAGE_RESULT]{"urgency":"see_doctor_today","emoji":"🟡","title":"See Doctor Within 24 Hours","summary":"Your assessment summary here.","action":"Recommended next step.","symptoms":["Symptom 1","Symptom 2"]}[/TRIAGE_RESULT]
- Urgency values: "emergency" (🔴), "see_doctor_today" (🟡), or "monitor_at_home" (🟢).
- Keep responses concise (2–4 sentences + question). Never exceed 5 sentences outside of the triage block.
- ALWAYS end non-triage responses with a clear follow-up question.
- Always recommend seeing a real doctor for serious conditions. You do not replace a physician.`;

            let messages = [{ role: "system", content: SYSTEM_PROMPT }];
            let exchangeCount = 0;
            let triageShown = false;
            let isRecording = false;
            let speechRec = null;

            const chatArea = document.getElementById("chat-area");
            const typingWrap = document.getElementById("typing-wrap");
            const triageSec = document.getElementById("triage-section");
            const userInput = document.getElementById("user-input");

            // ── Helpers ────────────────────────────────────────────────────────────────
            const now = () =>
                new Date().toLocaleTimeString("en-NG", {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: true,
                });

            function scrollBottom(smooth = true) {
                requestAnimationFrame(() => {
                    window.scrollTo({
                        top: document.body.scrollHeight,
                        behavior: smooth ? "smooth" : "auto",
                    });
                });
            }

            // ── Language chips ─────────────────────────────────────────────────────────
            function setLang(code) {
                ["en", "yo", "ha"].forEach((c) => {
                    const btn = document.getElementById("btn-" + c);
                    if (c === code) {
                        btn.classList.add("lang-active");
                        btn.style.color = "#fff";
                    } else {
                        btn.classList.remove("lang-active");
                        btn.style.color = "";
                    }
                });
            }

            // ── Care chips ─────────────────────────────────────────────────────────────
            function selectCareChip(who) {
                const self = document.getElementById("chip-self");
                const other = document.getElementById("chip-other");
                if (who === "self") {
                    self.className = self.className.replace(
                        "bg-surface-container border border-outline-variant text-on-surface-variant",
                        "border-2 border-transparent bg-primary-container text-on-primary-container",
                    );
                    other.className = other.className.replace(
                        "border-2 border-transparent bg-primary-container text-on-primary-container",
                        "bg-surface-container border border-outline-variant text-on-surface-variant",
                    );
                } else {
                    other.className = other.className.replace(
                        "bg-surface-container border border-outline-variant text-on-surface-variant",
                        "border-2 border-transparent bg-primary-container text-on-primary-container",
                    );
                    self.className = self.className.replace(
                        "border-2 border-transparent bg-primary-container text-on-primary-container",
                        "bg-surface-container border border-outline-variant text-on-surface-variant",
                    );
                }
            }

            // ── Add AI bubble ──────────────────────────────────────────────────────────
            function addBotMessage(text, streaming = false) {
                const wrap = document.createElement("div");
                wrap.className = "flex items-start gap-2 msg-pop";

                // Avatar
                const av = document.createElement("div");
                av.className =
                    "w-8 h-8 rounded-full bg-primary-container flex items-center justify-center flex-shrink-0 mt-0.5 shadow-sm";
                av.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#a3faef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/>
        <line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/>
      </svg>`;

                // Bubble wrapper
                const bw = document.createElement("div");
                bw.className = "max-w-[78%] flex flex-col gap-1";

                const box = document.createElement("div");
                box.className =
                    "bg-primary text-white rounded-2xl rounded-tl-none px-4 py-3 font-['Satoshi'] leading-relaxed whitespace-pre-wrap";
                box.style.fontSize = "14px";
                box.textContent = text;

                const meta = document.createElement("div");
                meta.className = "flex items-center gap-2 pl-1";
                meta.innerHTML = `
        <span class="text-on-surface-variant font-['Satoshi']" style="font-size:10px;">${now()}</span>
        <button onclick="speakText(this)" title="Listen"
          class="text-on-surface-variant hover:text-primary transition-colors">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </button>`;

                bw.appendChild(box);
                bw.appendChild(meta);
                wrap.appendChild(av);
                wrap.appendChild(bw);
                chatArea.appendChild(wrap);
                scrollBottom();
                return { box, metaEl: meta };
            }

            // ── Add user bubble ────────────────────────────────────────────────────────
            function addUserMessage(text, isVoice = false) {
                const wrap = document.createElement("div");
                wrap.className = "flex items-start gap-2 justify-end msg-pop";

                const bw = document.createElement("div");
                bw.className = "max-w-[78%] flex flex-col gap-1 items-end";

                const box = document.createElement("div");

                if (isVoice) {
                    box.className =
                        "bg-surface-variant rounded-2xl rounded-tr-none px-4 py-3";
                    box.innerHTML = `
          <div class="flex items-center gap-1.5 mb-1.5">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#005c55" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            </svg>
            <span class="text-on-surface-variant font-['Satoshi'] font-medium" style="font-size:11px;">Voice message</span>
          </div>
          <div class="flex items-end gap-0.5 mb-2" style="height:22px;">
            ${[6, 14, 20, 12, 18, 10, 16, 8]
                .map(
                    (h) =>
                        `<div class="wave-bar w-[3px]" style="height:${h}px;background:#005c55;"></div>`,
                )
                .join("")}
          </div>
          <p class="text-on-surface font-['Satoshi']" style="font-size:13px;">${text}</p>`;
                } else {
                    box.className =
                        "bg-surface-variant rounded-2xl rounded-tr-none px-4 py-3 text-on-surface font-['Satoshi'] leading-relaxed";
                    box.style.fontSize = "14px";
                    box.textContent = text;
                }

                const meta = document.createElement("div");
                meta.className = "flex items-center gap-1.5 pr-0.5";
                meta.innerHTML = `
        <span class="text-on-surface-variant font-['Satoshi']" style="font-size:10px;">${now()}</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#005c55"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>`;

                bw.appendChild(box);
                bw.appendChild(meta);
                wrap.appendChild(bw);
                chatArea.appendChild(wrap);
                scrollBottom();
            }

            // ── Typing indicator ───────────────────────────────────────────────────────
            function showTyping() {
                typingWrap.classList.remove("hidden");
                scrollBottom();
            }
            function hideTyping() {
                typingWrap.classList.add("hidden");
            }

            // ── Send handler ───────────────────────────────────────────────────────────
            function handleSend() {
                const text = userInput.value.trim();
                if (!text) return;
                userInput.value = "";
                addUserMessage(text);
                sendToAI(text);
            }

            // ── Cencori AI (streaming) ─────────────────────────────────────────────────
            async function sendToAI(userText, isVoice = false) {
                const apiKey = window.CENCORI_API_KEY;
                if (!apiKey) {
                    addBotMessage(
                        "⚠️ Cencori API key not configured.\n\nOpen the browser console and run:\n  localStorage.setItem('CENCORI_API_KEY', 'your-key')\nthen reload the page to enable AI features.",
                    );
                    return;
                }

                messages.push({ role: "user", content: userText });
                exchangeCount++;
                showTyping();

                try {
                    const res = await fetch(
                        "https://api.cencori.com/v1/chat/completions",
                        {
                            method: "POST",
                            headers: {
                                Authorization: `Bearer ${apiKey}`,
                                "Content-Type": "application/json",
                            },
                            body: JSON.stringify({
                                model: "claude-sonnet-4.5",
                                messages,
                                stream: true,
                                max_tokens: 650,
                            }),
                        },
                    );

                    hideTyping();

                    if (!res.ok) {
                        const errText = await res
                            .text()
                            .catch(() => res.statusText);
                        addBotMessage(`⚠️ API error ${res.status}: ${errText}`);
                        return;
                    }

                    const { box, metaEl } = addBotMessage("");
                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let full = "";

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        const chunk = decoder.decode(value, { stream: true });
                        for (const line of chunk.split("\n")) {
                            if (
                                line.startsWith("data: ") &&
                                !line.includes("[DONE]")
                            ) {
                                try {
                                    const d = JSON.parse(line.slice(6));
                                    const delta =
                                        d.choices?.[0]?.delta?.content || "";
                                    full += delta;
                                    // Strip triage block from live display
                                    const display = full
                                        .replace(
                                            /\[TRIAGE_RESULT\][\s\S]*?\[\/TRIAGE_RESULT\]/g,
                                            "",
                                        )
                                        .trimEnd();
                                    box.textContent = display;
                                    scrollBottom(false);
                                } catch (_) {}
                            }
                        }
                    }

                    // Final clean display
                    const cleanDisplay = full
                        .replace(
                            /\[TRIAGE_RESULT\][\s\S]*?\[\/TRIAGE_RESULT\]/g,
                            "",
                        )
                        .trim();
                    box.textContent = cleanDisplay;

                    // Update speaker button data
                    const speakBtn = metaEl.querySelector(
                        'button[onclick="speakText(this)"]',
                    );
                    if (speakBtn)
                        speakBtn.setAttribute("onclick", `speakText(this)`);
                    speakBtn && (speakBtn.dataset.text = cleanDisplay);

                    messages.push({ role: "assistant", content: full });

                    if (!triageShown) checkTriageResult(full);
                } catch (err) {
                    hideTyping();
                    addBotMessage(
                        `⚠️ Connection error: ${err.message}.\nPlease check your network and try again.`,
                    );
                }
            }

            // ── Triage result detection ────────────────────────────────────────────────
            function checkTriageResult(text) {
                if (triageShown) return;
                const match = text.match(
                    /\[TRIAGE_RESULT\]([\s\S]*?)\[\/TRIAGE_RESULT\]/,
                );
                if (match) {
                    try {
                        renderTriageCard(JSON.parse(match[1]));
                    } catch (_) {}
                }
            }

            // ── Render triage card ─────────────────────────────────────────────────────
            function renderTriageCard(r) {
                if (triageShown) return;
                triageShown = true;

                localStorage.setItem("triageResult", JSON.stringify(r));
                if (r.symptoms?.length)
                    localStorage.setItem(
                        "symptoms",
                        JSON.stringify(r.symptoms),
                    );

                const palettes = {
                    emergency: {
                        ring: "#ba1a1a",
                        bg: "#fff0f0",
                        badge: "#ba1a1a",
                        badgeFg: "#fff",
                        dot: "#ba1a1a",
                    },
                    see_doctor_today: {
                        ring: "#904d00",
                        bg: "#fff8f0",
                        badge: "#fe932c",
                        badgeFg: "#2f1500",
                        dot: "#904d00",
                    },
                    monitor_at_home: {
                        ring: "#005c55",
                        bg: "#f0fffd",
                        badge: "#0f766e",
                        badgeFg: "#a3faef",
                        dot: "#005c55",
                    },
                };
                const p = palettes[r.urgency] || palettes.see_doctor_today;

                triageSec.classList.remove("hidden");
                triageSec.innerHTML = `
        <div class="slide-up rounded-2xl border-2 p-5" style="border-color:${p.ring};background:${p.bg};">

          <!-- Header row -->
          <div class="flex items-start justify-between mb-3">
            <div class="flex items-start gap-2.5">
              <span style="font-size:28px;line-height:1;">${r.emoji || "🟡"}</span>
              <div>
                <p class="font-['Plus_Jakarta_Sans'] font-bold" style="font-size:15px;color:${p.ring};">AI Triage Result</p>
                <span class="inline-block mt-0.5 px-3 py-0.5 rounded-full font-['Satoshi'] font-bold" style="font-size:11px;background:${p.badge};color:${p.badgeFg};">${r.title}</span>
              </div>
            </div>
            <!-- Cencori badge -->
            <div class="flex items-center gap-1 bg-white rounded-full px-2 py-1 shadow-sm border border-outline-variant/40">
              <div class="w-3 h-3 rounded-full" style="background:#005c55;"></div>
              <span class="font-['Satoshi'] font-semibold text-on-surface" style="font-size:10px;">Cencori AI</span>
            </div>
          </div>

          <!-- Summary -->
          <p class="font-['Satoshi'] text-on-surface leading-relaxed mb-3" style="font-size:13px;">${r.summary}</p>

          <!-- Symptoms chips -->
          ${
              r.symptoms?.length
                  ? `
          <div class="mb-3">
            <p class="font-['Satoshi'] font-semibold text-on-surface-variant uppercase tracking-widest mb-2" style="font-size:10px;">Reported Symptoms</p>
            <div class="flex flex-wrap gap-1.5">
              ${r.symptoms
                  .map(
                      (s) => `
                <span class="bg-white border border-outline-variant text-on-surface rounded-full px-2.5 py-0.5 font-['Satoshi']" style="font-size:12px;">
                  <span class="mr-1" style="color:${p.dot};">●</span>${s}
                </span>`,
                  )
                  .join("")}
            </div>
          </div>`
                  : ""
          }

          <!-- Recommended action box -->
          <div class="flex items-start gap-2 rounded-xl p-3 mb-4" style="background:rgba(255,255,255,.7);">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="${p.dot}" stroke-width="2.2" stroke-linecap="round" class="mt-0.5 flex-shrink-0">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <p class="font-['Satoshi'] text-on-surface" style="font-size:13px;">${r.action}</p>
          </div>

          <!-- CTA -->
          <a href="care-pathway.html"
            class="flex items-center justify-center gap-2 w-full rounded-xl text-white font-['Plus_Jakarta_Sans'] font-bold py-3.5 transition-opacity hover:opacity-90 active:opacity-80"
            style="font-size:13px;letter-spacing:.04em;background:#005c55;">
            PROCEED TO APPOINTMENT RESOLUTION
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </a>

          <p class="text-center text-on-surface-variant font-['Satoshi'] mt-2.5" style="font-size:11px;">
            ⚠️ This AI assessment does not replace professional medical advice
          </p>
        </div>`;

                scrollBottom();
            }

            // ── TTS ────────────────────────────────────────────────────────────────────
            function speakText(btn) {
                const text =
                    btn
                        .closest(".flex")
                        ?.querySelector('div[class*="bg-primary"]')
                        ?.textContent || "";
                if (!text || !window.speechSynthesis) return;
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = "en-NG";
                window.speechSynthesis.speak(u);
            }

            // ── Voice Input ────────────────────────────────────────────────────────────
            function toggleVoice() {
                const SR =
                    window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SR) {
                    alert(
                        "Voice input is not supported in this browser. Please use Chrome or Edge.",
                    );
                    return;
                }

                const btn = document.getElementById("mic-btn");

                if (isRecording) {
                    speechRec?.stop();
                    isRecording = false;
                    btn.classList.remove("rec-pulse", "text-error");
                    btn.classList.add("text-on-surface-variant");
                    return;
                }

                speechRec = new SR();
                speechRec.lang = "en-NG";
                speechRec.continuous = false;
                speechRec.interimResults = true;

                isRecording = true;
                btn.classList.add("rec-pulse", "text-error");
                btn.classList.remove("text-on-surface-variant");

                speechRec.onresult = (e) => {
                    userInput.value = Array.from(e.results)
                        .map((r) => r[0].transcript)
                        .join("");
                };

                speechRec.onend = () => {
                    isRecording = false;
                    btn.classList.remove("rec-pulse", "text-error");
                    btn.classList.add("text-on-surface-variant");
                    const t = userInput.value.trim();
                    if (t) {
                        userInput.value = "";
                        addUserMessage(t, true);
                        sendToAI(t, true);
                    }
                };

                speechRec.onerror = () => {
                    isRecording = false;
                    btn.classList.remove("rec-pulse", "text-error");
                    btn.classList.add("text-on-surface-variant");
                };

                speechRec.start();
            }

            // ── Init ───────────────────────────────────────────────────────────────────
            window.addEventListener("DOMContentLoaded", () => {
                const WELCOME =
                    "Good day! I'm Àlàáfíà AI 👋\n\nẸ káàbọ̀! Welcome to Àlàáfíà Connect.\n\nTo help you better, could you please tell me your current age and the primary reason for your visit today?";
                setTimeout(() => {
                    addBotMessage(WELCOME);
                    messages.push({ role: "assistant", content: WELCOME });
                }, 700);
            });
        </script>
    </body>
</html>
