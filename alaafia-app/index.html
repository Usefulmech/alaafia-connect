<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Àlàáfíà Connect</title>
        <!-- Material Symbols for icon nodes -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,700&display=swap"
            rel="stylesheet"
        />
    </head>
    <style>
      /* Hide the Google Translate toolbar and tooltips completely */
      body { top: 0 !important; }
      .skiptranslate { display: none !important; }
      .goog-te-balloon-frame { display: none !important; }
      .goog-text-highlight { background-color: transparent !important; box-shadow: none !important; }
      font { background: transparent !important; color: inherit !important; box-shadow: none !important; }
    </style>
    <body>
        <div id="google_translate_element" style="display:none;"></div>
        <script type="text/javascript">
          function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                autoDisplay: false
            }, 'google_translate_element');
          }
        </script>
        <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
        <script>
          (function() {
            const langMap = { 'English': 'en', 'Yoruba': 'yo', 'Hausa': 'ha', 'Igbo': 'ig', 'Pidgin': 'en' };
            const selectedLang = localStorage.getItem('selectedLanguage') || 'English';
            const targetLang = langMap[selectedLang] || 'en';
            if (targetLang !== 'en') {
              document.cookie = `googtrans=/en/${targetLang}; path=/`;
            } else {
              document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            }
          })();
        </script>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
